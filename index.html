<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケモン検索</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">
    <section class="search-section">

      <div class="search-header">
        <label for="searchInput" class="search-label">
          ポケモンの名前で検索
        </label>

        <div class="result-info">
          <span id="resultCount"></span>
        </div>
      </div>

      <div class="search-box">
        <input type="search" id="searchInput" placeholder="例：ピカチュウ、メガ、Z" autocomplete="off">

        <button id="clearButton" type="button" aria-label="検索をクリア">
          ×
        </button>
      </div>

    </section>

    <section>
      <div id="results" class="results"></div>

      <div id="noResults" class="no-results hidden">
        <p>該当するポケモンが見つかりませんでした。</p>
      </div>
    </section>

  </main>

  <footer class="footer">
    <p>
      ポケモンたちのプロフィールが集まるSNSへようこそ！
      それぞれのポケモンがプロフィール画像と名前を公開中！
      気になるポケモンを探して、いろんなプロフィールをチェックしてみよう！
    </p>
    <p>
      本サイトで表示している画像は、
      <a href="https://www.pokemon.co.jp/ex/30th_logo/" target="_blank" rel="noopener noreferrer">
        ポケモン30周年ロゴ公式サイト
      </a>
      で配布されている素材を使用しています。
    </p>
    <p>
      画像の利用にあたっては、公式サイトの利用規約をご確認ください。
    </p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
